<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>CIW 차세대 키오스크 프로토타입 v0.7</title>
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
  <body>
    <div class="review-shell">
      <aside class="review-panel" id="reviewPanel">
        <div class="review-brand">
          <span class="review-kicker">CLIENT REVIEW PROTOTYPE</span>
          <h1>CIW 차세대 키오스크</h1>
          <p>1080×1920 · v0.7</p>
        </div>

        <div class="review-grid one review-back">
          <button type="button" data-action="review-back">← 이전 화면</button>
        </div>

        <section class="review-section">
          <h2>대표 시나리오</h2>
          <div class="review-grid one">
            <button data-scenario="general">일반 결제 플로우</button>
            <button data-scenario="qr">세차권 QR 인식</button>
            <button data-scenario="autoSingle">오토패스 · 1장</button>
            <button data-scenario="autoManual">오토패스 · 1장 수동</button>
            <button data-scenario="autoMultiple">오토패스 · 여러 장</button>
            <button data-scenario="autoNoTicket">오토패스 · 세차권 없음</button>
          </div>
        </section>

        <section class="review-section">
          <h2>화면 조건</h2>
          <label class="review-label">조작 높이</label>
          <div class="segmented" id="heightControl">
            <button data-height="low">기본 화면 (세단)</button>
            <button data-height="high">높은 화면 (SUV)</button>
          </div>
          <label class="review-label">세차기 상태</label>
          <div class="segmented wash-status-control" id="washStatusControl">
            <button type="button" data-wash-status="ready">대기중</button>
            <button type="button" data-wash-status="error">통신에러</button>
            <button type="button" data-wash-status="busy">앞차 세차 중</button>
          </div>
          <label class="review-label">상품권 사용/ 할인쿠폰 공통</label>
          <div class="segmented" id="voucherCaseControl">
            <button type="button" data-voucher-case="standard">추가결제 없음</button>
            <button type="button" data-voucher-case="additional">추가결제 있음</button>
          </div>
        </section>

        <section class="review-section">
          <h2>화면 바로가기</h2>
          <select id="screenSelect" aria-label="화면 선택"></select>
          <div class="review-grid one compact">
            <button data-scenario="admin">관리자 화면</button>
          </div>
        </section>

        <section class="review-section">
          <h2>공통 UI 미리보기</h2>
          <div class="review-grid one">
            <button data-action="timeout-preview">타임아웃 팝업 보기</button>
          </div>
        </section>

        <section class="review-section current-review" aria-live="polite">
          <span class="review-label">현재 화면</span>
          <strong id="currentScreenName">인트로</strong>
          <p id="currentScreenReq">REQ-001~004</p>
          <p class="review-note" id="currentScreenNote"></p>
        </section>

        <a class="review-open secondary" href="./CIW_차세대_키오스크_전체화면_v0.7.html" target="_blank" rel="noreferrer">
          전체 화면 모아보기 ↗
        </a>
        <a class="review-open" id="embedLink" href="?embed=1" target="_blank" rel="noreferrer">
          1080×1920 단독 보기 ↗
        </a>
        <p class="review-disclaimer">코스·금액·회원 정보는 화면 검토용 예시입니다.</p>
      </aside>

      <main class="stage" id="stage">
        <div class="kiosk-shell" id="kioskShell">
          <section class="kiosk" id="kiosk" aria-label="컴인워시 키오스크 화면"></section>
        </div>
      </main>
    </div>

  <script src="./assets/screen-catalog.js"></script>
<script src="./assets/app.js"></script>
<script src="./assets/screens/intro.js"></script>
<script src="./assets/screens/course.js"></script>
<script src="./assets/screens/payment.js"></script>
<script src="./assets/screens/completion.js"></script>
<script src="./assets/screens/autopass.js"></script>
<script src="./assets/screens/common.js"></script>
<script src="./assets/screens/admin.js"></script>
<script src="./assets/validation.js"></script>
<script src="./assets/init.js"></script>
</body>
</html>
